# CI 게이트 — 순서는 02 문서 §7 그대로:
# install(frozen) → typecheck → lint → format:check → test → build → publint/attw → pack 스모크
#
# 규칙(리뷰 M15·M16·S2):
# - pull_request 와 기본 브랜치 push 양쪽 트리거 (기본 브랜치가 CI 밖이면 안 된다)
# - permissions 최소 선언 + concurrency 그룹
# - 셸 스텝(run:)에 `${{ }}` 직접 치환 금지 — 값이 필요하면 env: 경유
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 버전 입력 없음 — 루트 package.json의 packageManager 필드가 유일한 소스
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Validate tokens (드리프트 게이트 포함)
        run: pnpm validate:tokens

      - name: Check docs pages (데모 없는 머지 금지)
        run: pnpm check:docs

      - name: Check icons (md5 중복·네이밍·배럴 누락)
        run: pnpm check:icons

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: publint + attw
        run: pnpm verify:pkg

      - name: Pack smoke
        run: pnpm smoke:pack

  # 시각 회귀 (16 문서) — 유닛 테스트가 보지 않는 픽셀을 덮는다.
  # ci 잡과 **병렬**로 돈다: 직렬로 붙이면 PR 대기 시간이 그만큼 길어진다.
  # 기준 이미지는 이 잡(리눅스)에서 만든 것만 쓴다 — 갱신은 Visual Baseline 워크플로.
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # 크로스 브라우저는 비목표 — chromium 하나만 받는다
      - name: Install chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Visual regression
        run: pnpm test:visual

      # 이게 없으면 "빨간불인데 뭐가 다른지 모름"이 되고 곧 잡을 끄게 된다
      - name: Upload diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff
          path: |
            test-results/
            playwright-report/
          retention-days: 7
