# 의존성 자동 업데이트 (06 문서 §5 / 리뷰 M15)
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 워크플로는 메이저 태그(`@v7`)를 참조한다 — 액션 제공자가 그 태그를 패치마다 옮겨 주므로
    # 패치·마이너 PR은 우리가 할 일이 없는 노이즈다(실제로 `@v6` → `@v6.0.9` 고정 PR이 왔다).
    # 메이저 업만 받는다 — 그때만 입력 이름·런타임이 바뀌어 사람이 확인할 값이 있다.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch", "version-update:semver-minor"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # 워크스페이스 전체 lockfile 하나이므로 루트만 지정한다
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
